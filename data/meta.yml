indicator:
  name: Growing Degree Days
  slug: growing-degree-days
  publisher: U.S. Environmental Protection Agency
  source_page: https://19january2025snapshot.epa.gov/climate-indicators/climate-change-indicators-growing-degree-days/index.html
  technical_documentation: https://19january2025snapshot.epa.gov/system/files/documents/2024-06/growing-degree-days_documentation.pdf
  rights: Public domain, work of the U.S. Government (17 U.S.C. 105)
datasets:
- file: growing_degree_days_change_by_station.csv
  figure: Figure 1
  figure_title: Figure 1. Change in Growing Degree Days in the Contiguous 48 States,
    1948–2023
  source_file: growing-degree-fig-1.csv
  source_sha256: 3ea32327c9e82623cb3512c052bc8cff8b6e81d5eaa4cbe1ce51eae3a292e46b
  source_encoding: windows-1252
  data_source: NOAA, 2024
  web_update: June 2024
  unit: percent change
  rows: 280
  columns:
  - name: latitude
    type: number
    description: Station latitude in decimal degrees north, verbatim from the source
      file
  - name: longitude
    type: number
    description: Station longitude in decimal degrees east, verbatim from the source
      file. Negative throughout, the contiguous 48 states being west of the prime
      meridian.
  - name: change_class_key
    type: string
    description: Machine-readable key of the legend class EPA's published map draws
      this station in. Added by this build; not a column in EPA's file. Class edges
      are exclusive at the lower end and inclusive at the upper end, and the build
      stops if any value sits exactly on an edge.
  - name: change_class_label
    type: string
    description: Display label of that class, transcribed from the legend of EPA's
      published figure
  - name: measure
    type: string
    description: What is measured
  - name: unit
    type: string
    description: Unit of `value`
  - name: value
    type: number
    description: Percent change in annual growing degree days between 1948 and 2023,
      verbatim from the source file
  - name: flag
    type: string
    description: Empty for an ordinary observation; a disclosure marker otherwise.
      Empty throughout this file, which publishes no suppressed values.
  series:
  - key: lt_neg_20
    label: <-20
    note: percent change at or below -20
  - key: neg_20_to_neg_10
    label: -10 to -20
    note: percent change above -20 and at or below -10
  - key: neg_10_to_neg_1
    label: -1 to -10
    note: percent change above -10 and at or below -1
  - key: neg_1_to_1
    label: -1 to 1
    note: percent change above -1 and at or below 1
  - key: pos_1_to_10
    label: 1 to 10
    note: percent change above 1 and at or below 10
  - key: pos_10_to_20
    label: 10 to 20
    note: percent change above 10 and at or below 20
  - key: gt_pos_20
    label: '>20'
    note: percent change above 20
  note: 'One row per weather station, not per year: EPA''s Figure 1 is a point map
    of change across the whole 1948 to 2023 period, so this file carries no year column
    and no time series. The `series` entries above are the seven classes of EPA''s
    published legend, in EPA''s own legend order, most negative first. A class can
    be empty in a given vintage; EPA draws all seven regardless, and a page reproducing
    the legend should do the same.'
